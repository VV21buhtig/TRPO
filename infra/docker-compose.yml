name: fastfood

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastfood
      POSTGRES_USER: fastfood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastfood}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastfood -d fastfood"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      UsePostgres: "true"
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=fastfood;
        Username=fastfood;Password=${POSTGRES_PASSWORD:-fastfood}
      Jwt__Key: ${JWT_KEY:-dev-only-change-me-fastfood-secret-2026}
      Jwt__Issuer: FastFood.Api
      Jwt__Audience: FastFood.Clients
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - api
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
